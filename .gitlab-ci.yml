stages:
  - version
  - release

variables:
  # Set this in CI/CD variables or use the default
  VERSION: "${CI_COMMIT_TAG:-v0.1.0}"

# Auto-tag on merge to main (optional - comment out if you prefer manual tagging)
tag_version:
  stage: version
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  only:
    - main
  except:
    - tags
  script:
    # Get the latest tag, or use v0.0.0 if none exists
    - |
      LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
      echo "Latest tag: $LATEST_TAG"
      
      # Extract version numbers (remove 'v' prefix)
      VERSION_NUM=$(echo $LATEST_TAG | sed 's/^v//')
      MAJOR=$(echo $VERSION_NUM | cut -d. -f1)
      MINOR=$(echo $VERSION_NUM | cut -d. -f2)
      PATCH=$(echo $VERSION_NUM | cut -d. -f3)
      
      # Auto-increment patch version
      NEW_PATCH=$((PATCH + 1))
      NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
      
      echo "Creating tag: $NEW_VERSION"
      git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
      git push origin "$NEW_VERSION"
  when: manual  # Change to 'on_success' for automatic tagging or 

# Manual version tagging job
# Usage: Run this job manually and set VERSION variable (e.g., v0.2.0)
tag_manual:
  stage: version
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  only:
    - main
  script:
    - |
      if [ -z "$VERSION" ] || [ "$VERSION" = "v0.1.0" ]; then
        echo "Error: Set VERSION variable (e.g., v0.2.0) in CI/CD variables or job variables"
        exit 1
      fi
      
      # Validate version format (must start with 'v' and be semver)
      if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
        echo "Error: VERSION must be semantic version (e.g., v0.2.0)"
        exit 1
      fi
      
      # Check if tag already exists
      if git rev-parse "$VERSION" >/dev/null 2>&1; then
        echo "Error: Tag $VERSION already exists"
        exit 1
      fi
      
      echo "Creating tag: $VERSION"
      git tag -a "$VERSION" -m "Release $VERSION"
      git push origin "$VERSION"
  when: manual

# Release job - runs when a tag is pushed
release:
  stage: release
  image: golang:1.21-alpine
  only:
    - tags
  script:
    - |
      TAG_NAME=${CI_COMMIT_TAG}
      echo "Building release for $TAG_NAME"
      
      # Verify go.mod is valid
      go mod verify
      go mod download
      
      # Run tests if you have them
      # go test ./...
      
      # Build (optional - for binaries)
      # go build -o swytchcode-runtime ./...
      
      echo "Release $TAG_NAME is ready"
      echo "Users can install with: go get gitlab.com/swytchcode/go-runtime@${TAG_NAME}"
  
  # Optional: Create GitLab release (requires GitLab Premium or GitLab.com)
  # release:
  #   name: 'Release $CI_COMMIT_TAG'
  #   tag_name: '$CI_COMMIT_TAG'
  #   description: 'Release $CI_COMMIT_TAG'

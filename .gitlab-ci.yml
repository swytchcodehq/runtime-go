stages:
  - version
  - release

variables:
  # Set this in CI/CD variables or use the default
  VERSION: "${CI_COMMIT_TAG:-v0.1.0}"

# Auto-tag on merge to main (optional - comment out if you prefer manual tagging)
tag_version:
  stage: version
  image: alpine:latest
  before_script:
    - apk add --no-cache git
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
  only:
    - main
  except:
    - tags
  script:
    # Get the latest tag, or use v0.1.0 if none exists
    - |
      git remote set-url origin "https://oauth2:${CI_JOB_TOKEN}@gitlab.com/swytchcode/go-runtime.git"
      
      LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
      echo "Latest tag: $LATEST_TAG"
      
      # Extract version numbers (remove 'v' prefix)
      VERSION_NUM=$(echo $LATEST_TAG | sed 's/^v//')
      MAJOR=$(echo $VERSION_NUM | cut -d. -f1)
      MINOR=$(echo $VERSION_NUM | cut -d. -f2)
      PATCH=$(echo $VERSION_NUM | cut -d. -f3)
      
      # Auto-increment patch version
      NEW_PATCH=$((PATCH + 1))
      NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
      
      echo "Creating tag: $NEW_VERSION"
      git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
      git push origin "$NEW_VERSION"
  when: manual  # Change to 'on_success' for automatic tagging or 

# Manual version tagging job
# Usage: Run this job manually to auto-increment patch version
tag_manual:
  stage: version
  image: alpine:latest
  before_script:
    - apk add --no-cache git
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
  only:
    - main
  script:
    - |
      git remote set-url origin "https://oauth2:${CI_JOB_TOKEN}@gitlab.com/swytchcode/go-runtime.git"
      
      # Get the latest tag, or use v0.1.0 if none exists
      LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
      echo "Latest tag: $LATEST_TAG"
      
      # Extract version numbers (remove 'v' prefix)
      VERSION_NUM=$(echo $LATEST_TAG | sed 's/^v//')
      MAJOR=$(echo $VERSION_NUM | cut -d. -f1)
      MINOR=$(echo $VERSION_NUM | cut -d. -f2)
      PATCH=$(echo $VERSION_NUM | cut -d. -f3)
      
      # Auto-increment patch version
      NEW_PATCH=$((PATCH + 1))
      NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
      
      echo "Creating tag: $NEW_VERSION"
      git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
      git push origin "$NEW_VERSION"
  when: manual

# Release job - runs when a tag is pushed
release:
  stage: release
  image: golang:1.21-alpine
  only:
    - tags
  script:
    - |
      TAG_NAME=${CI_COMMIT_TAG}
      echo "Building release for $TAG_NAME"
      
      # Verify go.mod is valid
      go mod verify
      go mod download
      
      # Run tests if you have them
      # go test ./...
      
      # Build (optional - for binaries)
      # go build -o swytchcode-runtime ./...
      
      echo "Release $TAG_NAME is ready"
      echo "Users can install with: go get gitlab.com/swytchcode/go-runtime@${TAG_NAME}"
  
  # Optional: Create GitLab release (requires GitLab Premium or GitLab.com)
  # release:
  #   name: 'Release $CI_COMMIT_TAG'
  #   tag_name: '$CI_COMMIT_TAG'
  #   description: 'Release $CI_COMMIT_TAG'

stages:
  - version
  - release

variables:
  # Set this in CI/CD variables or use the default
  VERSION: "${CI_COMMIT_TAG:-v0.1.0}"

# Automatic tagging on merge to main
tag_version:
  stage: version
  image: alpine:latest
  before_script:
    - apk add --no-cache git
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
    # Configure git credentials for pushing tags
    - git config --global credential.helper store
    - echo "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}" > ~/.git-credentials
    # Fetch all tags to ensure we have the latest
    - git fetch --tags --force
  only:
    - main
  except:
    - tags
  script:
    - |
      echo "=== Automatic Version Tagging ==="
      
      # Get the latest tag, or use v0.0.0 if none exists (will become v0.1.0)
      LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
      echo "Latest tag found: $LATEST_TAG"
      
      # Extract version numbers (remove 'v' prefix)
      VERSION_NUM=$(echo $LATEST_TAG | sed 's/^v//')
      MAJOR=$(echo $VERSION_NUM | cut -d. -f1)
      MINOR=$(echo $VERSION_NUM | cut -d. -f2)
      PATCH=$(echo $VERSION_NUM | cut -d. -f3)
      
      # If no tags exist (v0.0.0), start at v0.1.0
      if [ "$LATEST_TAG" = "v0.0.0" ]; then
        NEW_VERSION="v0.1.0"
      else
        # Auto-increment patch version
        NEW_PATCH=$((PATCH + 1))
        NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
      fi
      
      # Check if tag already exists and increment if needed (safety check)
      while git rev-parse "$NEW_VERSION" >/dev/null 2>&1; do
        echo "Tag $NEW_VERSION already exists. Incrementing..."
        NEW_PATCH=$((NEW_PATCH + 1))
        NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
      done
      
      echo "Creating new tag: $NEW_VERSION"
      git tag -a "$NEW_VERSION" -m "Automatic release: $NEW_VERSION [ci skip]"
      git push origin "$NEW_VERSION"
      echo "✓ Tag $NEW_VERSION created and pushed successfully"
  when: on_success 


# Release job - runs automatically when a tag is pushed
release:
  stage: release
  image: golang:1.21-alpine
  only:
    - tags
  script:
    - |
      TAG_NAME=${CI_COMMIT_TAG}
      echo "=== Building Release: $TAG_NAME ==="
      
      # Verify go.mod is valid
      go mod verify
      go mod download
      
      # Run tests if you have them
      # go test ./...
      
      # Build (optional - for binaries)
      # go build -o swytchcode-runtime ./...
      
      echo "✓ Release $TAG_NAME is ready"
      echo "Users can install with: go get gitlab.com/swytchcode/go-runtime@${TAG_NAME}"
  
  # Create GitLab release automatically
  release:
    name: 'Release $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    description: 'Automatic release $CI_COMMIT_TAG'

# Publish to GitLab Package Registry
publish:
  stage: release
  image: golang:1.21-alpine
  only:
    - tags
  script:
    - |
      TAG_NAME=${CI_COMMIT_TAG}
      echo "=== Publishing $TAG_NAME to GitLab Package Registry ==="
      
      # Verify module can be fetched
      go mod verify
      
      echo "✓ Module published successfully"
      echo ""
      echo "To use this module, configure Go to use GitLab Package Registry:"
      echo "  go env -w GOPRIVATE=gitlab.com/swytchcode/*"
      echo "  go env -w GOPROXY=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/go,https://proxy.golang.org,direct"
      echo ""
      echo "Then install with:"
      echo "  go get gitlab.com/swytchcode/go-runtime@${TAG_NAME}"
